<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Rutina">
<meta name="theme-color" content="#0a0a0a">
<title>Mi Rutina</title>
<style>
:root {
  --bg: #0a0a0a;
  --card: #141414;
  --card2: #1c1c1c;
  --border: #2a2a2a;
  --accent: #e8223a;
  --accent2: #ff6b35;
  --blue: #3b82f6;
  --green: #22c55e;
  --text: #f0f0f0;
  --muted: #888;
  --sub: #555;
  --radius: 14px;
  --timer-color: #e8223a;
}
.light {
  --bg: #f0f0f0;
  --card: #ffffff;
  --card2: #f8f8f8;
  --border: #e0e0e0;
  --text: #111;
  --muted: #666;
  --sub: #aaa;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { font-family: -apple-system, 'SF Pro Display', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; transition: background 0.3s, color 0.3s; }

/* ── HEADER ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.app-title { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.app-title span { color: var(--accent); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { background: var(--card2); border: none; border-radius: 10px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; color: var(--text); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1; padding: 10px 4px 8px; display: flex; flex-direction: column;
  align-items: center; gap: 3px; cursor: pointer; border: none; background: none; color: var(--sub);
  font-size: 10px; font-weight: 600; transition: color 0.15s;
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 20px; line-height: 1; }

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* ── DAY SELECTOR ── */
.day-scroll { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
.day-scroll::-webkit-scrollbar { display: none; }
.day-chip {
  flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
  border: 1.5px solid var(--border); background: var(--card);
  color: var(--muted); font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.day-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.day-chip.done-day { border-color: var(--green); color: var(--green); }

/* ── BLOCK PILLS ── */
.block-scroll { display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto; scrollbar-width: none; }
.block-scroll::-webkit-scrollbar { display: none; }
.block-pill {
  flex-shrink: 0; padding: 6px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.block-pill.active { background: var(--card2); border-color: var(--text); color: var(--text); }

/* ── PROGRESS BAR ── */
.progress-wrap { padding: 0 16px 12px; }
.progress-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.progress-bg { background: var(--card2); border-radius: 10px; height: 5px; }
.progress-fill { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 10px; height: 5px; transition: width 0.4s ease; }

/* ── EXERCISE CARD ── */
.ex-list { padding: 0 16px; }
.block-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); padding: 16px 0 8px; }

.ex-card {
  background: var(--card); border-radius: var(--radius);
  margin-bottom: 10px; overflow: hidden;
  border: 1px solid var(--border);
  transition: opacity 0.3s, border-color 0.2s;
}
.ex-card.completed { opacity: 0.4; }
.ex-card.completed .ex-check { background: var(--green); border-color: var(--green); }

.ex-main { display: flex; align-items: center; gap: 12px; padding: 14px; }
.ex-check {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; background: transparent;
  font-size: 14px; color: transparent;
}
.ex-card.completed .ex-check { color: #fff; }
.ex-info { flex: 1; min-width: 0; }
.ex-name { font-size: 14px; font-weight: 700; margin-bottom: 5px; line-height: 1.3; }
.ex-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ex-tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--card2); color: var(--muted); }
.ex-tag.red { background: rgba(232,34,58,0.12); color: var(--accent); }
.ex-tag.green { background: rgba(34,197,94,0.12); color: var(--green); }
.ex-tag.blue { background: rgba(59,130,246,0.12); color: var(--blue); }

.ex-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; }
.action-btn {
  border: none; border-radius: 8px; padding: 6px 10px;
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.btn-img { background: var(--card2); color: var(--text); }
.btn-timer { background: rgba(232,34,58,0.15); color: var(--accent); }
.btn-info { background: var(--card2); color: var(--muted); }

.ex-detail {
  display: none; padding: 0 14px 14px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.ex-detail.open { display: block; }
.ex-how { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 6px; }
.ex-desc-text { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
.ex-tip-box { background: rgba(232,34,58,0.08); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 8px 10px; font-size: 12px; color: var(--muted); line-height: 1.5; }

/* ── TIMER MODAL ── */
.timer-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  align-items: center; justify-content: center; flex-direction: column;
}
.timer-overlay.open { display: flex; }
.timer-circle {
  width: 200px; height: 200px; border-radius: 50%;
  border: 4px solid var(--card2);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; margin-bottom: 24px; position: relative;
}
.timer-svg { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); }
.timer-circle-track { fill: none; stroke: var(--card2); stroke-width: 4; }
.timer-circle-fill { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.timer-num { font-size: 52px; font-weight: 900; letter-spacing: -2px; line-height: 1; }
.timer-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.timer-ex-name { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 24px; text-align: center; padding: 0 20px; }
.timer-btns { display: flex; gap: 12px; }
.timer-btn {
  padding: 14px 28px; border-radius: 14px; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer;
}
.timer-btn.primary { background: var(--accent); color: #fff; }
.timer-btn.secondary { background: var(--card2); color: var(--text); }
.timer-presets { display: flex; gap: 8px; margin-bottom: 20px; }
.timer-preset {
  padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); font-size: 12px;
  font-weight: 700; cursor: pointer;
}
.timer-preset.sel { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── RESUMEN VIEW ── */
.resumen-wrap { padding: 16px; }
.res-day-card { background: var(--card); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; border: 1px solid var(--border); }
.res-day-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.res-day-name { font-size: 15px; font-weight: 800; }
.res-badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
.badge-cali { background: rgba(232,34,58,0.12); color: var(--accent); }
.badge-pesas { background: rgba(59,130,246,0.12); color: var(--blue); }
.res-block { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.res-block:last-child { border-bottom: none; }
.res-block-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
.res-ex { display: flex; justify-content: space-between; font-size: 12px; color: var(--text); padding: 3px 0; }
.res-ex span { color: var(--muted); font-size: 11px; }

/* ── SEARCH VIEW ── */
.search-wrap { padding: 16px; }
.search-bar {
  width: 100%; padding: 14px 16px; border: 2px solid var(--border);
  border-radius: var(--radius); background: var(--card); color: var(--text);
  font-size: 15px; outline: none; margin-bottom: 12px;
}
.search-bar:focus { border-color: var(--accent); }
.search-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.s-tag {
  font-size: 11px; font-weight: 700; padding: 6px 12px;
  border-radius: 20px; background: var(--card); color: var(--muted);
  border: 1px solid var(--border); cursor: pointer;
}
.s-tag:active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sr-card { background: var(--card); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; border: 1px solid var(--border); }
.sr-head { padding: 8px 14px; background: var(--card2); }
.sr-day { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--accent); }
.sr-block { font-size: 10px; color: var(--muted); }
.sr-body { padding: 12px 14px; }
.sr-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.sr-detail { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.sr-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
.no-results { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 20px; }

/* ── CARDIO CARD ── */
.cardio-card { background: var(--card); border-radius: var(--radius); margin-bottom: 10px; padding: 16px; border: 1px solid var(--border); }
.cardio-title { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
.cardio-protocol { background: var(--card2); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.cardio-protocol p { font-size: 12px; color: var(--muted); line-height: 1.8; }
.cardio-why { font-size: 12px; color: var(--muted); line-height: 1.6; }

/* ── CONFETTI / COMPLETION ── */
@keyframes pop { 0%{transform:scale(0.8);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
.day-complete-banner {
  background: linear-gradient(135deg, #22c55e22, #22c55e11);
  border: 1px solid #22c55e44; border-radius: var(--radius);
  padding: 14px 16px; margin: 0 16px 12px;
  display: none; animation: pop 0.3s ease;
  text-align: center; font-size: 14px; font-weight: 700; color: var(--green);
}
.day-complete-banner.show { display: block; }

/* ── UTIL ── */
.img-btn { background: var(--card2); color: var(--text); border: none; border-radius: 8px; padding: 7px 12px; font-size: 11px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; }
</style>
</head>
<body>

<!-- TIMER OVERLAY -->
<div class="timer-overlay" id="timerOverlay">
  <div class="timer-ex-name" id="timerExName">Descanso</div>
  <div class="timer-presets">
    <div class="timer-preset sel" onclick="setPreset(60)">1 min</div>
    <div class="timer-preset" onclick="setPreset(90)">90 seg</div>
    <div class="timer-preset" onclick="setPreset(120)">2 min</div>
    <div class="timer-preset" onclick="setPreset(150)">2:30</div>
  </div>
  <div class="timer-circle">
    <svg class="timer-svg" viewBox="0 0 216 216">
      <circle class="timer-circle-track" cx="108" cy="108" r="100"/>
      <circle class="timer-circle-fill" id="timerArc" cx="108" cy="108" r="100" stroke-dasharray="628" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-num" id="timerNum">1:00</div>
    <div class="timer-label" id="timerLabel">DESCANSO</div>
  </div>
  <div class="timer-btns">
    <button class="timer-btn secondary" onclick="closeTimer()">✕ Cerrar</button>
    <button class="timer-btn primary" id="timerToggleBtn" onclick="toggleTimer()">▶ Iniciar</button>
  </div>
</div>

<!-- HEADER -->
<div class="app-header">
  <div class="app-title">Mi <span>Rutina</span></div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Modo claro/oscuro">☀️</button>
    <button class="icon-btn" onclick="openTimer(60,'Descanso libre')" title="Timer">⏱</button>
  </div>
</div>

<!-- ════════ VIEW: ENTRENAR ════════ -->
<div class="view active" id="view-train">
  <div class="day-scroll" id="dayChips"></div>
  <div class="progress-wrap">
    <div class="progress-top">
      <span id="progressLabel">Progreso del día</span>
      <span id="progressCount">0 / 0</span>
    </div>
    <div class="progress-bg"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="day-complete-banner" id="completeBanner">🎉 ¡Día completado! Gran trabajo.</div>
  <div class="block-scroll" id="blockPills"></div>
  <div class="ex-list" id="exList"></div>
</div>

<!-- ════════ VIEW: RESUMEN ════════ -->
<div class="view" id="view-resumen">
  <div class="resumen-wrap" id="resumenContent"></div>
</div>

<!-- ════════ VIEW: BUSCAR ════════ -->
<div class="view" id="view-buscar">
  <div class="search-wrap">
    <input type="search" class="search-bar" id="searchBar" placeholder="Buscar ejercicio... ej: isquio, gluteo, LCA" oninput="doSearch()">
    <div class="search-tags">
      <div class="s-tag" onclick="qs('core')">Core</div>
      <div class="s-tag" onclick="qs('gluteo medio')">Glúteo medio</div>
      <div class="s-tag" onclick="qs('isquio')">Isquiotibiales</div>
      <div class="s-tag" onclick="qs('LCA')">LCA</div>
      <div class="s-tag" onclick="qs('propiocepcion')">Propiocepción</div>
      <div class="s-tag" onclick="qs('dominadas')">Dominadas</div>
      <div class="s-tag" onclick="qs('pliometria')">Pliometría</div>
      <div class="s-tag" onclick="qs('sprint')">Sprint</div>
      <div class="s-tag" onclick="qs('TRX')">TRX</div>
      <div class="s-tag" onclick="qs('unipodal')">Unipodal</div>
      <div class="s-tag" onclick="qs('excentrico')">Excéntrico</div>
      <div class="s-tag" onclick="qs('cardio')">Cardio</div>
      <div class="s-tag" onclick="qs('hombro')">Hombro</div>
      <div class="s-tag" onclick="qs('biceps')">Bíceps</div>
    </div>
    <div id="searchResults"><p class="no-results">Buscá un ejercicio o tocá una etiqueta</p></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="showView('train')" id="nav-train">
    <span class="nav-icon">💪</span>Entrenar
  </button>
  <button class="nav-item" onclick="showView('resumen')" id="nav-resumen">
    <span class="nav-icon">📋</span>Resumen
  </button>
  <button class="nav-item" onclick="showView('buscar')" id="nav-buscar">
    <span class="nav-icon">🔍</span>Buscar
  </button>
</nav>

<script>
// ════════════════════════════════
// DATA
// ════════════════════════════════
const DAYS = [
  {
    id:'lun', label:'LUNES', type:'cali', typeLabel:'Calistenia + Z2',
    blocks:[
      {id:'core', label:'🧱 Core', exercises:[
        {id:'l-c1', name:'Elevación de piernas en barra', tags:['3v × 15','core'], tagStyle:['',''], restSec:0, muscle:'Core / Flexores cadera', desc:'Colgado de la barra, subí las piernas juntas a 90° sin balanceo. Bajá lento con control abdominal todo el tiempo.', tip:'Sin balanceo. Si balanceás, pausá y volvé a empezar.', img:'hanging+leg+raise+abs+bar'},
        {id:'l-c2', name:'Abdominal declinado', tags:['3v × 15','abdomen'], restSec:0, muscle:'Recto abdominal', desc:'En banco declinado. Subí con el abdomen, no con inercia. Sin jalar del cuello. Bajá lento.', tip:'No jalés el cuello. El movimiento lo genera el abdomen.', img:'decline+sit+up+abdominal'},
        {id:'l-c3', name:'Plancha frontal', tags:['3v × 60 seg','core'], restSec:60, muscle:'Core completo / Glúteo', desc:'Antebrazos y puntas de pie. Cuerpo rígido, glúteo apretado, cadera en línea. Respirá profundo.', tip:'Si la cadera cae o sube, bajá a 40 seg y progresá.', img:'forearm+plank+core+form'},
        {id:'l-c4', name:'Pallof Press con polea', tags:['3v × 12 c/lado','anti-rotación'], restSec:0, muscle:'Core anti-rotación / Oblicuos', desc:'De lado a la polea. Empujá al frente con brazos extendidos y resistí la rotación. El core trabaja para que el cuerpo no gire.', tip:'Cuanto más lejos de la polea, más difícil. Empezá cerca.', img:'pallof+press+cable+anti+rotation+core'},
      ]},
      {id:'propio', label:'🧠 Propiocepción', exercises:[
        {id:'l-p1', name:'Sentadilla isométrica en pared', tags:['3 × 45 seg','pie derecho'], tagStyle:['','red'], restSec:45, muscle:'Cuádriceps derecho / LCA', desc:'Espalda en pared, rodillas a 90°, pie derecho ligeramente adelante. El cuádriceps aprende a sostener carga sin reflejo de protección.', tip:'Es propiocepción, no fuerza. El objetivo es que el cerebro confíe en la pierna derecha.', img:'wall+sit+isometric+quad+ACL+rehab'},
        {id:'l-p2', name:'Step Down Anterior', tags:['3 × 10','bajada 4 seg','der. primero'], tagStyle:['','red','red'], restSec:60, muscle:'Cuádriceps / LCA / Control excéntrico', desc:'Parado en pie derecho en el borde de un cajón. Bajá el pie izquierdo en 4 segundos sin apoyarlo. Volvé. Reentrena el control excéntrico del cuádriceps.', tip:'Hacé este ejercicio frente al espejo las primeras semanas. La rodilla NO debe colapsar hacia adentro.', img:'step+down+anterior+ACL+eccentric+quad'},
        {id:'l-p3', name:'Monster Walk con banda', tags:['3 × 15 pasos','glúteo medio'], tagStyle:['','green'], restSec:60, muscle:'Glúteo medio / Abductores', desc:'Banda en tobillos. Semisquadilla, pasos laterales amplios manteniendo tensión en la banda. 15 pasos a la derecha, 15 a la izquierda.', tip:'El glúteo medio débil = rodilla que colapsa. Este ejercicio lo corrige directamente.', img:'monster+walk+resistance+band+glute+medius'},
      ]},
      {id:'plio', label:'⚡ Pliometría', exercises:[
        {id:'l-pl1', name:'Box Jump bilateral', tags:['3 × 5','descanso 90"'], tagStyle:['',''], restSec:90, muscle:'Cuádriceps / Glúteo / Potencia', desc:'Máxima explosión al cajón. Aterrizá silencioso con rodillas flexionadas absorbiendo el impacto. Bajá caminando — nunca saltando.', tip:'Si hacés ruido al aterrizar, el impacto lo absorbe la articulación, no el músculo.', img:'box+jump+soft+landing+plyometric+ACL'},
        {id:'l-pl2', name:'Skater Jump corto', tags:['3 × 6 c/lado','aguantar 2 seg'], tagStyle:['','red'], restSec:60, muscle:'Glúteo medio / Agilidad lateral / LCA', desc:'Saltá lateralmente aterrizando en un pie. Aguantá 2 segundos inmóvil antes de volver. El salto es corto — importa el control del aterrizaje.', tip:'La pausa de 2 seg es obligatoria. Le da tiempo al cerebro a registrar que la rodilla está estable.', img:'skater+jump+lateral+ACL+single+leg+landing'},
      ]},
      {id:'cali', label:'💪 Calistenia', exercises:[
        {id:'l-f1', name:'Dominadas agarre abierto', tags:['4 × 8–10','descanso 2\''], tagStyle:['',''], restSec:120, muscle:'Dorsal / Romboides / Bíceps', desc:'Agarre prono ancho. Rango completo hasta que el mentón pase la barra. Bajá lento 2–3 seg. Pecho al frente en la subida.', tip:'Si no llegás a 8 reps limpias usá banda de asistencia. Rango completo siempre.', img:'wide+grip+pull+up+back+form'},

// Build search index
const searchIndex = [];
DAYS.forEach(day => {
  day.blocks.forEach(block => {
    block.exercises.forEach(ex => {
      searchIndex.push({
        day: day.label,
        dayId: day.id,
        block: block.label,
        name: ex.name,
        tags: ex.tags.join(' '),
        muscle: ex.muscle,
        desc: ex.desc,
        img: ex.img,
        detail: ex.tags.join(' · '),
      });
    });
  });
});

// State
let currentDay = 'lun';
let currentBlock = null;
let completedExercises = JSON.parse(localStorage.getItem('completed') || '{}');
let timerInterval = null;
let timerSeconds = 60;
let timerTotal = 60;
let timerRunning = false;

// ════════════════════════════════
// RENDER
// ════════════════════════════════
function renderDayChips() {
  const c = document.getElementById('dayChips');
  c.innerHTML = DAYS.map(d => {
    const dayCompleted = isDayComplete(d.id);
    return `<div class="day-chip ${d.id === currentDay ? 'active' : ''} ${dayCompleted ? 'done-day' : ''}" onclick="selectDay('${d.id}')">${d.label}${dayCompleted ? ' ✓' : ''}</div>`;
  }).join('');
}

function renderBlockPills() {
  const day = DAYS.find(d => d.id === currentDay);
  const c = document.getElementById('blockPills');
  if (!currentBlock) currentBlock = day.blocks[0].id;
  c.innerHTML = day.blocks.map(b =>
    `<div class="block-pill ${b.id === currentBlock ? 'active' : ''}" onclick="selectBlock('${b.id}')">${b.label}</div>`
  ).join('');
}

function renderExercises() {
  const day = DAYS.find(d => d.id === currentDay);
  const block = day.blocks.find(b => b.id === currentBlock) || day.blocks[0];
  const c = document.getElementById('exList');
  c.innerHTML = `<div class="block-label">${block.label}</div>` +
    block.exercises.map(ex => {
      const done = completedExercises[ex.id];
      const tagHtml = ex.tags.map((t,i) => {
        const s = ex.tagStyle && ex.tagStyle[i] ? ex.tagStyle[i] : '';
        return `<span class="ex-tag ${s}">${t}</span>`;
      }).join('');
      const restLabel = ex.restSec > 0 ? `⏱ ${ex.restSec >= 60 ? Math.floor(ex.restSec/60)+'\''+( ex.restSec%60 ? (ex.restSec%60)+'"' : '') : ex.restSec+'"'}` : '';
      return `
        <div class="ex-card ${done ? 'completed' : ''}" id="card-${ex.id}">
          <div class="ex-main">
            <div class="ex-check" onclick="toggleDone('${ex.id}')">${done ? '✓' : ''}</div>
            <div class="ex-info">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-tags">${tagHtml}</div>
            </div>
            <div class="ex-actions">
              <button class="action-btn btn-img" onclick="window.open('https://www.google.com/search?q=${ex.img}&tbm=isch','_blank')">🔍 Imagen</button>
              ${ex.restSec > 0 ? `<button class="action-btn btn-timer" onclick="openTimer(${ex.restSec},'${ex.name.replace(/'/g,'\\'')}')">⏱ ${restLabel}</button>` : ''}
              <button class="action-btn btn-info" onclick="toggleDetail('${ex.id}')">ℹ Info</button>
            </div>
          </div>
          <div class="ex-detail" id="detail-${ex.id}">
            <div class="ex-how">¿Cómo se hace?</div>
            <div class="ex-desc-text">${ex.desc}</div>
            ${ex.tip ? `<div class="ex-tip-box">💡 ${ex.tip}</div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  updateProgress();
}

function selectDay(id) {
  currentDay = id;
  currentBlock = DAYS.find(d => d.id === id).blocks[0].id;
  renderDayChips();
  renderBlockPills();
  renderExercises();
  document.getElementById('completeBanner').classList.remove('show');
}

function selectBlock(id) {
  currentBlock = id;
  renderBlockPills();
  renderExercises();
}

// ════════════════════════════════
// PROGRESS
// ════════════════════════════════
function updateProgress() {
  const day = DAYS.find(d => d.id === currentDay);
  const allEx = day.blocks.flatMap(b => b.exercises);
  const total = allEx.length;
  const done = allEx.filter(ex => completedExercises[ex.id]).length;
  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = done + ' / ' + total;
  document.getElementById('progressLabel').textContent = pct === 100 ? '✅ Día completo' : 'Progreso del día';
  const banner = document.getElementById('completeBanner');
  if (pct === 100 && done > 0) banner.classList.add('show');
  else banner.classList.remove('show');
}

function isDayComplete(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return false;
  const allEx = day.blocks.flatMap(b => b.exercises);
  return allEx.length > 0 && allEx.every(ex => completedExercises[ex.id]);
}

function toggleDone(exId) {
  completedExercises[exId] = !completedExercises[exId];
  if (!completedExercises[exId]) delete completedExercises[exId];
  localStorage.setItem('completed', JSON.stringify(completedExercises));
  const card = document.getElementById('card-' + exId);
  const check = card.querySelector('.ex-check');
  if (completedExercises[exId]) {
    card.classList.add('completed');
    check.textContent = '✓';
  } else {
    card.classList.remove('completed');
    check.textContent = '';
  }
  updateProgress();
  renderDayChips();
}

function toggleDetail(exId) {
  const d = document.getElementById('detail-' + exId);
  d.classList.toggle('open');
}

// ════════════════════════════════
// TIMER
// ════════════════════════════════
function openTimer(sec, name) {
  timerSeconds = sec;
  timerTotal = sec;
  timerRunning = false;
  document.getElementById('timerExName').textContent = name || 'Descanso';
  document.getElementById('timerToggleBtn').textContent = '▶ Iniciar';
  updateTimerDisplay();
  document.querySelectorAll('.timer-preset').forEach(p => p.classList.remove('sel'));
  const presets = [60, 90, 120, 150];
  const idx = presets.indexOf(sec);
  if (idx >= 0) document.querySelectorAll('.timer-preset')[idx].classList.add('sel');
  document.getElementById('timerOverlay').classList.add('open');
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function closeTimer() {
  document.getElementById('timerOverlay').classList.remove('open');
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerRunning = false;
}

function setPreset(sec) {
  if (timerRunning) return;
  timerSeconds = sec;
  timerTotal = sec;
  document.querySelectorAll('.timer-preset').forEach(p => p.classList.remove('sel'));
  event.target.classList.add('sel');
  updateTimerDisplay();
}

function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerInterval = null;
    timerRunning = false;
    document.getElementById('timerToggleBtn').textContent = '▶ Reanudar';
  } else {
    timerRunning = true;
    document.getElementById('timerToggleBtn').textContent = '⏸ Pausar';
    timerInterval = setInterval(() => {
      timerSeconds--;
      updateTimerDisplay();
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerRunning = false;
        document.getElementById('timerToggleBtn').textContent = '🔄 Reiniciar';
        document.getElementById('timerLabel').textContent = '¡LISTO!';
        if ('vibrate' in navigator) navigator.vibrate([200,100,200]);
      }
    }, 1000);
  }
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  document.getElementById('timerNum').textContent = m + ':' + (s < 10 ? '0' : '') + s;
  const pct = timerTotal > 0 ? timerSeconds / timerTotal : 1;
  const circ = 628;
  document.getElementById('timerArc').style.strokeDashoffset = circ * (1 - pct);
  document.getElementById('timerLabel').textContent = timerSeconds <= 0 ? '¡LISTO!' : 'DESCANSO';
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'resumen') renderResumen();
  if (name === 'buscar') document.getElementById('searchBar').focus();
}

          <div style="text-align:right;">
            <span class="res-badge ${day.type === 'cali' ? 'badge-cali' : 'badge-pesas'}">${day.type === 'cali' ? 'Calistenia' : 'Pesas'}</span>
            <div style="font-size:11px;color:${pct===100?'var(--green)':'var(--muted)'};margin-top:4px;font-weight:700;">${pct}% completado</div>
          </div>
        </div>
        ${day.blocks.map(block => `
          <div class="res-block">
            <div class="res-block-title">${block.label}</div>
            ${block.exercises.map(ex => `
              <div class="res-ex" style="${completedExercises[ex.id] ? 'opacity:0.4;text-decoration:line-through;' : ''}">
                <span>${ex.name}</span>
                <span>${ex.tags[0] || ''}</span>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}

// ════════════════════════════════
// SEARCH
// ════════════════════════════════
function qs(term) {
  document.getElementById('searchBar').value = term;
  doSearch();
}

function doSearch() {
  const q = document.getElementById('searchBar').value.toLowerCase().trim();
  const c = document.getElementById('searchResults');
  if (!q) { c.innerHTML = '<p class="no-results">Buscá un ejercicio o tocá una etiqueta</p>'; return; }
  const results = searchIndex.filter(e =>
    e.name.toLowerCase().includes(q) ||
    e.muscle.toLowerCase().includes(q) ||
    e.tags.toLowerCase().includes(q) ||
    e.day.toLowerCase().includes(q) ||
    e.block.toLowerCase().includes(q) ||
    e.desc.toLowerCase().includes(q)
  );
  if (!results.length) { c.innerHTML = '<p class="no-results">No encontré ejercicios. Probá con otra palabra.</p>'; return; }
  c.innerHTML = results.map(e => `
    <div class="sr-card">
      <div class="sr-head">
        <div class="sr-day">${e.day}</div>
        <div class="sr-block">${e.block}</div>
      </div>
      <div class="sr-body">
        <div class="sr-name">${e.name}</div>
        <div class="sr-detail">${e.detail}</div>
        <div class="sr-desc">${e.desc}</div>
        <button class="img-btn" onclick="window.open('https://www.google.com/search?q=${e.img}&tbm=isch','_blank')">🔍 Ver imagen</button>
      </div>
    </div>
  `).join('');
}

// ════════════════════════════════
// THEME
// ════════════════════════════════
let isDark = true;
function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

// ════════════════════════════════
// INIT
// ════════════════════════════════
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light') { isDark = false; document.body.classList.add('light'); document.getElementById('themeBtn').textContent = '🌙'; }

renderDayChips();
renderBlockPills();
renderExercises();
</script>
