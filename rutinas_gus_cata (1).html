<script>
function mkCC(p){return CC.map(function(e){return {id:p+e.id,name:e.name,tags:e.tags,ts:e.ts,rs:e.rs,m:e.m,d:e.d,t:e.t,i:e.i};})}

var DATA={gus:GD,cata:CD};
var per="gus",cd={gus:"lun",cata:"lun"},cb={gus:null,cata:null};
var st=JSON.parse(localStorage.getItem("rv7")||"{}");
var ti=null,ts=75,tt=75,tr=false;

function sP(p){
  per=p;
  document.querySelectorAll(".pv").forEach(function(v){v.classList.remove("on");});
  document.getElementById("pv-"+p).classList.add("on");
  document.getElementById("bg").className="pb"+(p==="gus"?" ag":"");
  document.getElementById("bc").className="pb"+(p==="cata"?" ac":"");
  document.getElementById("hn").textContent=p==="gus"?"Gustavo":"Catalina";
  document.body.style.setProperty("--acc",p==="gus"?"#e8223a":"#a855f7");
  rAll();
}

function rAll(){rDC(per);rBP(per);rEX(per);}

function rDC(p){
  var c=document.getElementById(p+"-dc"),h="";
  DATA[p].forEach(function(d){
    var ok=dOk(p,d.id);
    h+="<div class=\"dc"+(d.id===cd[p]?" on":"")+"\" onclick=\"sD('"+p+"','"+d.id+"')\">"+d.lb+(ok?" ok":"")+"</div>";
  });
  c.innerHTML=h;
}

function rBP(p){
  var day=DATA[p].find(function(d){return d.id===cd[p];});
  if(!cb[p])cb[p]=day.bl[0].id;
  var c=document.getElementById(p+"-bp"),h="";
  day.bl.forEach(function(b){
    h+="<div class=\"bp"+(b.id===cb[p]?" on":"")+"\" onclick=\"sB('"+p+"','"+b.id+"')\">"+b.lb+"</div>";
  });
  c.innerHTML=h;
}

function rEX(p){
  var day=DATA[p].find(function(d){return d.id===cd[p];});
  var blk=day.bl.find(function(b){return b.id===cb[p];})||day.bl[0];
  var di=document.getElementById(p+"-di");
  if(day.inf&&day.inf.t){
    di.innerHTML="<div class=\"di\"><div class=\"dit\">"+day.inf.t+"</div>"+(day.inf.s?"<div class=\"dis\">"+day.inf.s+"</div>":"")+"</div>";
  }else{di.innerHTML="";}
  var mgEl=document.getElementById(p+"-mg");
  if(day.mg&&mgEl){
    var mch="";
    day.mg.chips.forEach(function(ch){mch+="<div class=\"mg-chip "+ch.cls+"\">"+ch.lb+"</div>";});
    var mbr="";
    day.mg.bars.forEach(function(b){mbr+="<div class=\"mg-row\"><div class=\"mg-lbl\">"+b.lb+"</div><div class=\"mg-track\"><div class=\"mg-fill\" style=\"width:"+b.pct+"%;background:"+b.cl+"\"></div></div><div class=\"mg-cnt\">"+b.n+"</div></div>";});
    mgEl.innerHTML="<div class=\"mg\"><div class=\"mg-t\">Musculos del dia</div><div class=\"mg-chips\">"+mch+"</div><div class=\"mg-div\"></div><div class=\"mg-bars\">"+mbr+"</div></div>";
    mgEl.style.display="block";
  }else if(mgEl){mgEl.innerHTML="";}
  var el=document.getElementById(p+"-el"),h="<div class=\"bl\">"+blk.lb+"</div>";
  blk.ex.forEach(function(ex){
    var ok=st[p+"-"+ex.id];
    var tgs=ex.ts||[];
    var tags="";
    ex.tags.forEach(function(tg,i){tags+="<span class=\"tg "+(tgs[i]||"")+"\">"+tg+"</span>";});
    var rl="";
    if(ex.rs>0){var m=Math.floor(ex.rs/60),s=ex.rs%60;rl=(m>0?m+"m":"")+( s>0?s+"s":"");}
    var img="https://www.google.com/search?q="+ex.i+"&tbm=isch";
    var acts="<button class=\"ab im\" onclick=\"window.open('"+img+"','_blank')\">Imagen</button>";
    if(ex.rs>0)acts+="<button class=\"ab tm\" onclick=\"opT("+ex.rs+")\">"+rl+" Timer</button>";
    acts+="<button class=\"ab in\" onclick=\"tgD('"+p+"','"+ex.id+"')\">Info</button>";
    h+="<div class=\"ec"+(ok?" dn":"")+(ex.lo?" lo":"")+" id=\"ec-"+p+"-"+ex.id+"\">";
    h+="<div class=\"em\"><div class=\"ck\" onclick=\"tgDn('"+p+"','"+ex.id+"')\">"+(ok?"ok":"")+"</div>";
    h+="<div class=\"ei\"><div class=\"en\">"+ex.name+(ex.lo?"<span class=\"lo-badge\">+ LesionOut</span>":"")+"</div><div class=\"et\">"+tags+"</div></div>";
    h+="<div class=\"ea\">"+acts+"</div></div>";
    h+="<div class=\"ed\" id=\"ed-"+p+"-"+ex.id+"\">";
    h+="<div class=\"eh\">Como se hace?</div><div class=\"edsc\">"+ex.d+"</div>";
    if(ex.t)h+="<div class=\"etp\">"+ex.t+"</div>";
    h+="</div></div>";
  });
  el.innerHTML=h;
  uPr(p);
}

function sD(p,id){
  cd[p]=id;cb[p]=DATA[p].find(function(d){return d.id===id;}).bl[0].id;
  document.getElementById(p+"-bn").classList.remove("on");
  rDC(p);rBP(p);rEX(p);
}
function sB(p,id){cb[p]=id;rBP(p);rEX(p);}

function tgDn(p,id){
  var k=p+"-"+id;st[k]=!st[k];if(!st[k])delete st[k];
  localStorage.setItem("rv7",JSON.stringify(st));
  var card=document.getElementById("ec-"+p+"-"+id);
  var chk=card.querySelector(".ck");
  if(st[k]){card.classList.add("dn");chk.textContent="ok";}
  else{card.classList.remove("dn");chk.textContent="";}
  uPr(p);rDC(p);
}

function tgD(p,id){document.getElementById("ed-"+p+"-"+id).classList.toggle("on");}

function uPr(p){
  var day=DATA[p].find(function(d){return d.id===cd[p];});
  var all=day.bl.reduce(function(a,b){return a.concat(b.ex);},[]);
  var n=all.filter(function(e){return st[p+"-"+e.id];}).length;
  var pct=all.length>0?Math.round(n/all.length*100):0;
  document.getElementById(p+"-pf").style.width=pct+"%";
  document.getElementById(p+"-pc").textContent=n+"/"+all.length;
  document.getElementById(p+"-pl").textContent=pct===100?"Completado!":"Progreso";
  if(pct===100&&n>0)document.getElementById(p+"-bn").classList.add("on");
  else document.getElementById(p+"-bn").classList.remove("on");
}

function dOk(p,id){
  var day=DATA[p].find(function(d){return d.id===id;});if(!day)return false;
  var all=day.bl.reduce(function(a,b){return a.concat(b.ex);},[]);
  return all.length>0&&all.every(function(e){return st[p+"-"+e.id];});
}

function sV(n){
  ["t","r","s"].forEach(function(v){
    var el=document.getElementById(per+"-v"+v);if(el)el.classList.toggle("on",v===n);
  });
  document.querySelectorAll(".ni").forEach(function(x){x.classList.remove("on");});
  document.getElementById("nv-"+n).classList.add("on");
  if(n==="r")rRes(per);
}

function rRes(p){
  var c=document.getElementById(p+"-rc"),h="";
  DATA[p].forEach(function(day){
    var all=day.bl.reduce(function(a,b){return a.concat(b.ex);},[]);
    var n=all.filter(function(e){return st[p+"-"+e.id];}).length;
    var pct=all.length>0?Math.round(n/all.length*100):0;
    h+="<div class=\"rd\"><div class=\"rh\"><div><div class=\"rn\">"+day.lb+"</div><div style=\"font-size:10px;color:#555;margin-top:1px;\">"+day.tl+"</div></div><div style=\"font-size:11px;color:"+(pct===100?"#22c55e":"#555")+";font-weight:700;\">"+pct+"%</div></div>";
    day.bl.forEach(function(b){
      h+="<div class=\"rb\"><div class=\"rbt\">"+b.lb+"</div>";
      b.ex.forEach(function(e){
        h+="<div class=\"re\" style=\""+(st[p+"-"+e.id]?"opacity:.4;text-decoration:line-through;":"")+"\"><span>"+e.name+"</span><span>"+(e.tags[0]||"")+"</span></div>";
      });
      h+="</div>";
    });
    h+="</div>";
  });
  c.innerHTML=h;
}

var sidx={gus:[],cata:[]};
["gus","cata"].forEach(function(p){
  DATA[p].forEach(function(day){
    day.bl.forEach(function(blk){
      blk.ex.forEach(function(ex){
        sidx[p].push({day:day.lb,blk:blk.lb,name:ex.name,tags:ex.tags.join(" "),m:ex.m||"",d:ex.d||"",i:ex.i||""});
      });
    });
  });
});

function qs(p,tg){document.getElementById(p+"-sb").value=tg;dS(p);}
function dS(p){
  var q=document.getElementById(p+"-sb").value.toLowerCase().trim();
  var c=document.getElementById(p+"-sr");
  if(!q){c.innerHTML="<p class=\"nr\">Busca un ejercicio o toca una etiqueta</p>";return;}
  var res=sidx[p].filter(function(e){return e.name.toLowerCase().indexOf(q)>=0||e.m.toLowerCase().indexOf(q)>=0||e.tags.toLowerCase().indexOf(q)>=0||e.d.toLowerCase().indexOf(q)>=0;});
  if(!res.length){c.innerHTML="<p class=\"nr\">No encontre ejercicios. Proba con otra palabra.</p>";return;}
  var h="";
  res.forEach(function(e){
    h+="<div class=\"sr2\"><div class=\"srh\"><div class=\"srd\">"+e.day+"</div><div class=\"srb\">"+e.blk+"</div></div><div class=\"srd2\"><div class=\"srn\">"+e.name+"</div><div class=\"srdesc\">"+e.d+"</div><button class=\"imgb\" onclick=\"window.open('https://www.google.com/search?q="+e.i+"&tbm=isch','_blank')\">Ver imagen</button></div></div>";
  });
  c.innerHTML=h;
}

function opT(sec){
  ts=sec;tt=sec;tr=false;
  document.getElementById("ttog").textContent="Iniciar";
  document.getElementById("tlbl").textContent="DESCANSO";
  uT();
  document.querySelectorAll(".tp").forEach(function(x){x.classList.remove("on");});
  [60,75,90,120].forEach(function(s,i){if(s===sec)document.querySelectorAll(".tp")[i].classList.add("on");});
  document.getElementById("tov").classList.add("on");
  if(ti){clearInterval(ti);ti=null;}
}
function ctT(){document.getElementById("tov").classList.remove("on");if(ti){clearInterval(ti);ti=null;}tr=false;}
function sp(sec,el){if(tr)return;ts=sec;tt=sec;document.querySelectorAll(".tp").forEach(function(x){x.classList.remove("on");});el.classList.add("on");uT();}
function tgT(){
  if(tr){clearInterval(ti);ti=null;tr=false;document.getElementById("ttog").textContent="Reanudar";}
  else{tr=true;document.getElementById("ttog").textContent="Pausar";ti=setInterval(function(){ts--;uT();if(ts<=0){clearInterval(ti);ti=null;tr=false;document.getElementById("ttog").textContent="Reiniciar";document.getElementById("tlbl").textContent="LISTO!";if("vibrate"in navigator)navigator.vibrate([200,100,200]);}},1000);}
}
function uT(){
  var m=Math.floor(ts/60),s=ts%60;
  document.getElementById("tnum").textContent=m+":"+(s<10?"0":"")+s;
  var pct=tt>0?ts/tt:1;
  document.getElementById("tarc").style.strokeDashoffset=559*(1-pct);
  if(ts>0)document.getElementById("tlbl").textContent="DESCANSO";
}

rAll();
</script>
